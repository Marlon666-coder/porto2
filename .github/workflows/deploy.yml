name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # `cache: npm` is not set: it fails the job when no lockfile is
          # committed. Add it back after committing package-lock.json.

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json is missing. Run 'npm install' locally and commit it for reproducible builds."
            npm install --no-audit --no-fund
          fi

      - name: Build (Next.js static export, includes type check)
        # The base path is derived from GITHUB_REPOSITORY in next.config.mjs.
        # Set a repository variable BASE_PATH to override (e.g. "/" for a custom domain).
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Disable Jekyll
        # Jekyll would drop the `_next/` folder, which holds every script and style.
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
